name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RUSTUP_TOOLCHAIN: '1.100.0'
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the annotated tag
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          # Checkout can replace its local annotated tag with the event's commit.
          # Restore the remote tag object, then verify it against the checked-out commit.
          git fetch --no-tags origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"

      - name: Install the pinned Rust compiler
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Build and check the release archive
        run: |
          timeout 30s ./scripts/package "$RELEASE_TAG"
          cd build/release
          sha256sum --check SHA256SUMS

      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "A release already exists for $RELEASE_TAG. Existing assets are preserved." >&2
            exit 1
          fi
          archive="steam-high-priority-$RELEASE_TAG-linux-x86_64.tar.gz"
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Prebuilt static Linux x86-64 release. The archive includes the corresponding source and AGPL-3.0 license.

          ## Install
          Download \`$archive\` and \`SHA256SUMS\` into the same directory, then run:

          \`\`\`bash
          sha256sum --check SHA256SUMS
          tar -xzf "$archive"
          cd steam-high-priority
          ./install
          \`\`\`

          Close any existing Steam session, open a new terminal, and run \`steam\`.

          ## Requirements
          Linux x86-64, cgroup v2, native Steam, and systemd 250 or newer with \`systemd-run --expand-environment=no\`. Installation uses Bash, GNU coreutils, binutils, and util-linux. Rust is needed only for source builds.

          ## Upgrade or remove
          Install the new archive with \`./install\`. To remove the policy, close Steam and run \`./uninstall\`. Keep the extracted directory for removal.
          EOF
          gh release create "$RELEASE_TAG" \
            "build/release/$archive" build/release/SHA256SUMS \
            --verify-tag --draft --title "steam-high-priority $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
